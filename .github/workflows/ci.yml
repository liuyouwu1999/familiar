name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # actions 按 SHA 钉死（对齐 NovaX 体系；SHA 为 v4/v6 官方提交，防 tag 被动）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Unit tests + assemble debug
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Android Lint（baseline 之外零新增告警，审计 E5）
        run: ./gradlew :app:lintDebug
      - name: ktlint report（report 模式：ignoreFailures=true，报告在 build/reports/ktlint/）
        run: ./gradlew :app:ktlintCheck
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/**
          if-no-files-found: ignore

  # 发版验证（docs/RELEASE.md）：一次性 CI keystore 跑 assembleRelease——
  # 验证 R8/lintVital/资源收缩/打包签名守卫全链；正式签名密钥永不离开本机。
  # CI 生成的 keystore.properties 与 ci-verify.keystore 被 .gitignore 已有规则覆盖
  # （keystore.properties、*.keystore）。不跑 release 变体单测：与 build-test 的 debug
  # 单测同源重复无增益（AGP 8.7 下 testReleaseUnitTest 任务虽存在）。
  # 本 job 在所有触发（main/PR/tag）上全量跑：行为更严，无 tag 过滤必要。
  release-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Generate one-shot CI keystore (verify-only, never the release key)
        run: |
          keytool -genkeypair -v -keystore ci-verify.keystore -alias ci-verify \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass verify-only -keypass verify-only \
            -dname "CN=familiar-ci-verify, OU=verify-only, O=Familiar, C=CN"
          printf 'storeFile=ci-verify.keystore\nstorePassword=verify-only\nkeyAlias=ci-verify\nkeyPassword=verify-only\n' > keystore.properties
      - name: Release build (R8 / lintVital / resource shrink / packaging guard)
        run: ./gradlew :app:assembleRelease --stacktrace
